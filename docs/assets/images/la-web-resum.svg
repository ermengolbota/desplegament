<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1870" viewBox="0 0 1000 1870" role="img" aria-labelledby="title description">
  <title id="title">La Web: visió global</title>
  <desc id="description">Una URL identifica un recurs; HTML, JSON o una imatge en representen el contingut; HTTP intercanvia peticions i respostes i HTTPS protegeix el transport. El client inicia peticions i rep respostes. Un proxy o una CDN poden intermediar. Al servidor, la presentació interpreta entrades i prepara resultats, el negoci aplica regles i permisos i l'accés a dades consulta o desa informació persistent. La resposta torna al client. Els permisos es comproven al servidor, la memòria cau reutilitza segons una política i les capes lògiques no equivalen a màquines. HTTP és sense estat, però l'aplicació pot mantenir sessions i dades. En HTTP/1.1, la línia inicial i les capçaleres són text amb una sintaxi definida. Una línia en blanc separa les capçaleres del cos opcional. Exemple: una petició GET i una resposta 200 OK amb el cos Hola. El cos pot ser text o dades binàries; HTTP/2 i HTTP/3 utilitzen un format binari.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#17689b"/>
    </marker>
    <marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#23734d"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .section-title { font-size: 24px; font-weight: 700; fill: #163a52; }
    .card-title { font-size: 26px; font-weight: 700; }
    .body { font-size: 22px; fill: #263b4a; }
    .small { font-size: 19px; fill: #435967; }
    .http-code { font-family: Consolas, 'Courier New', monospace; font-size: 18px; fill: #263b4a; }
    .request { fill: none; stroke: #17689b; stroke-width: 3; marker-end: url(#request-arrow); }
    .response { fill: none; stroke: #23734d; stroke-width: 3; marker-end: url(#response-arrow); }
  </style>
  <rect x="1" y="1" width="998" height="1868" rx="20" fill="#fafbfc" stroke="#d6dce2" stroke-width="2"/>

  <path d="M 20 1 H 980 Q 999 1 999 20 V 130 H 1 V 20 Q 1 1 20 1 Z" fill="#163a52"/>
  <text x="40" y="61" font-size="38" font-weight="700" fill="#fff">LA WEB · VISIÓ GLOBAL</text>
  <text x="40" y="101" font-size="24" fill="#d3e8f5">D’una adreça a una operació amb dades</text>

  <text class="section-title" x="40" y="179">1. Tres peces que treballen juntes</text>
  <g class="info-card" text-anchor="middle">
    <rect x="40" y="200" width="290" height="140" rx="12" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="185" y="232" font-size="18" font-weight="700" fill="#164e73">IDENTIFICAR</text>
    <text class="card-title" x="185" y="273" fill="#164e73">URI / URL</text>
    <text class="body" x="185" y="311">Quin recurs volem?</text>
  </g>
  <g class="info-card" text-anchor="middle">
    <rect x="355" y="200" width="290" height="140" rx="12" fill="#fff3e6" stroke="#a65b16" stroke-width="2"/>
    <text x="500" y="232" font-size="18" font-weight="700" fill="#854810">REPRESENTAR</text>
    <text x="500" y="273" font-size="24" font-weight="700" fill="#854810">HTML · JSON · imatges</text>
    <text class="body" x="500" y="311">Quin contingut rebem?</text>
  </g>
  <g class="info-card" text-anchor="middle">
    <rect x="670" y="200" width="290" height="140" rx="12" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
    <text x="815" y="232" font-size="18" font-weight="700" fill="#205b3e">COMUNICAR</text>
    <text class="card-title" x="815" y="273" fill="#205b3e">HTTP / HTTPS</text>
    <text class="body" x="815" y="311">Peticions i respostes</text>
  </g>
  <text class="small" x="500" y="373" text-anchor="middle">La Web funciona sobre Internet. HTTPS protegeix la comunicació.</text>

  <text class="section-title" x="40" y="421">2. Del client a les dades… i de tornada</text>
  <g class="info-card" text-anchor="middle">
    <rect x="40" y="505" width="220" height="170" rx="12" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="150" y="546" font-size="30" font-weight="700" fill="#164e73">Client</text>
    <text x="150" y="580" font-size="19" fill="#164e73">Navegador / programa</text>
    <text class="body" x="150" y="620">Inicia peticions</text>
    <text class="body" x="150" y="651">Rep respostes</text>
  </g>

  <g class="server">
    <rect x="540" y="450" width="420" height="440" rx="16" fill="#fff" stroke="#647788" stroke-width="2"/>
    <text class="card-title" x="750" y="491" text-anchor="middle" fill="#163a52">Servidor / aplicació</text>
    <g class="info-card" text-anchor="middle">
      <rect x="560" y="520" width="380" height="90" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
      <text x="750" y="554" font-size="24" font-weight="700" fill="#164e73">Presentació</text>
      <text class="body" x="750" y="587">Entrades i resultats</text>
    </g>
    <path class="request" d="M 750 610 V 636"/>
    <g class="info-card" text-anchor="middle">
      <rect x="560" y="640" width="380" height="90" rx="10" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
      <text x="750" y="674" font-size="24" font-weight="700" fill="#205b3e">Lògica de negoci</text>
      <text x="750" y="707" font-size="21" fill="#263b4a">Aplica permisos i regles</text>
    </g>
    <path class="request" d="M 750 730 V 756"/>
    <g class="info-card" text-anchor="middle">
      <rect x="560" y="760" width="380" height="90" rx="10" fill="#f3eef9" stroke="#7251a4" stroke-width="2"/>
      <text x="750" y="794" font-size="24" font-weight="700" fill="#5c3d8a">Accés a dades</text>
      <text class="body" x="750" y="827">Consulta i desa informació</text>
    </g>
  </g>

  <path class="request" d="M 260 550 H 536"/>
  <text x="400" y="533" text-anchor="middle" font-size="22" font-weight="600" fill="#164e73">Petició HTTP</text>
  <path class="response" d="M 540 610 H 264"/>
  <text x="400" y="642" text-anchor="middle" font-size="22" font-weight="600" fill="#205b3e">Resposta</text>
  <text x="400" y="670" text-anchor="middle" font-size="18" fill="#205b3e">HTML · JSON · recursos</text>
  <g class="info-card" text-anchor="middle">
    <rect x="290" y="451" width="220" height="49" rx="24" fill="#f0f3f6" stroke="#647788"/>
    <text x="400" y="481" font-size="18" fill="#435967">Proxy / CDN opcionals</text>
  </g>
  <path d="M 400 500 V 508 M 400 541 V 550" fill="none" stroke="#647788" stroke-width="2" stroke-dasharray="4 5"/>

  <g class="info-card">
    <rect x="40" y="750" width="460" height="140" rx="12" fill="#fff3e6" stroke="#a65b16" stroke-width="2"/>
    <text x="62" y="787" font-size="24" font-weight="700" fill="#854810">Exemple: reservar un llibre</text>
    <text class="body" x="62" y="829">Validar → desar → confirmar</text>
    <text x="62" y="863" font-size="20" fill="#263b4a">La resposta expressa el resultat real.</text>
  </g>
  <path class="request" d="M 750 850 V 946"/>
  <text class="small" x="775" y="926">consulta / canvi</text>
  <g class="info-card" text-anchor="middle">
    <rect x="540" y="950" width="420" height="110" rx="12" fill="#f3f5f7" stroke="#647788" stroke-width="2"/>
    <text class="card-title" x="750" y="994" fill="#354552">Dades persistents</text>
    <text class="body" x="750" y="1030">Base de dades / fitxers</text>
  </g>
  <text class="body" x="40" y="949">El client i el servidor són rols.</text>
  <text class="body" x="40" y="984">La presentació també pot viure</text>
  <text class="body" x="40" y="1017">al navegador.</text>

  <text class="section-title" x="40" y="1120">3. Tres recordatoris essencials</text>
  <g class="info-card" text-anchor="middle">
    <rect x="40" y="1140" width="290" height="150" rx="12" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
    <text x="185" y="1182" font-size="24" font-weight="700" fill="#205b3e">Control d’accés</text>
    <text class="body" x="185" y="1224">Validar i autoritzar</text>
    <text class="body" x="185" y="1256">al servidor.</text>
  </g>
  <g class="info-card" text-anchor="middle">
    <rect x="355" y="1140" width="290" height="150" rx="12" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="500" y="1182" font-size="24" font-weight="700" fill="#164e73">Memòria cau</text>
    <text class="body" x="500" y="1224">Reutilitzar respostes</text>
    <text class="body" x="500" y="1256">segons la política.</text>
  </g>
  <g class="info-card" text-anchor="middle">
    <rect x="670" y="1140" width="290" height="150" rx="12" fill="#f3eef9" stroke="#7251a4" stroke-width="2"/>
    <text x="815" y="1182" font-size="24" font-weight="700" fill="#5c3d8a">Capes ≠ màquines</text>
    <text class="body" x="815" y="1224">Separar responsabilitats</text>
    <text class="body" x="815" y="1256">no exigeix tres servidors.</text>
  </g>
  <text x="500" y="1330" text-anchor="middle" font-size="20" fill="#435967">HTTP és sense estat; l’aplicació pot mantenir sessions i dades.</text>

  <text class="section-title" x="40" y="1400">4. HTTP: missatges d’anada i tornada amb unes normes</text>
  <text x="40" y="1440" font-size="21" fill="#263b4a">HTTP/1.1: línia inicial → capçaleres → línia en blanc → cos (si n’hi ha).</text>
  <g class="info-card">
    <rect x="40" y="1470" width="445" height="255" rx="12" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="60" y="1508" font-size="22" font-weight="700" fill="#164e73">Petició: client → servidor</text>
    <text class="http-code" x="60" y="1550">GET / HTTP/1.1</text>
    <text class="http-code" x="60" y="1582">Host: example.org</text>
    <text class="http-code" x="60" y="1612">Accept: text/plain</text>
    <rect x="55" y="1624" width="415" height="30" rx="4" fill="#ffe8b3"/>
    <text x="70" y="1645" font-size="18" font-weight="600" fill="#704500">LÍNIA EN BLANC</text>
    <text x="60" y="1688" font-size="20" fill="#435967">Aquesta petició no té cos.</text>
  </g>
  <g class="info-card">
    <rect x="515" y="1470" width="445" height="255" rx="12" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
    <text x="535" y="1508" font-size="22" font-weight="700" fill="#205b3e">Resposta: servidor → client</text>
    <text class="http-code" x="535" y="1550">HTTP/1.1 200 OK</text>
    <text class="http-code" x="535" y="1582">Content-Type: text/plain; charset=utf-8</text>
    <text class="http-code" x="535" y="1612">Content-Length: 4</text>
    <rect x="530" y="1624" width="415" height="30" rx="4" fill="#ffe8b3"/>
    <text x="545" y="1645" font-size="18" font-weight="600" fill="#704500">LÍNIA EN BLANC</text>
    <text class="http-code" x="535" y="1688">Hola</text>
    <text x="620" y="1688" font-size="19" fill="#435967">← cos: 4 bytes, sense salt final</text>
  </g>
  <text x="40" y="1765" font-size="20" fill="#263b4a">Línia inicial: mètode + recurs + versió, o versió + estat. Capçaleres: Nom: valor.</text>
  <text x="40" y="1797" font-size="20" font-weight="600" fill="#704500">La línia en blanc separa les capçaleres del contingut.</text>
  <text x="40" y="1829" font-size="19" fill="#435967">El cos pot ser text o dades binàries. HTTP/2 i HTTP/3 utilitzen un format binari.</text>
</svg>
