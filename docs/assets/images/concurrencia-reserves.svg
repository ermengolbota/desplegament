  <title id="title">Dues peticions de reserva</title>
  <desc id="description">En aquest ordre: Persona A consulta i veu disponible; Persona B consulta i veu disponible; Persona A demana reservar; Persona B demana reservar. No es mostra el resultat de les reserves.</desc>
