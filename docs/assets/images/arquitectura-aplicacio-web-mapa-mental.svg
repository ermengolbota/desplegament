<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
  <title id="title">Mapa mental de l'arquitectura de les aplicacions web</title>
  <desc id="description">Una aplicació web separa presentació, lògica de negoci i administració de dades. Vuit branques resumeixen les funcions, les capes lògiques i els nivells de desplegament, els models de dues, tres i múltiples capes, MVC i les API, l'organització i l'execució, el cas pràctic de reserva, l'estat i la qualitat, i els materials de repàs. La reserva exigeix coordinar permisos, regles, persistència, concurrència, reintents i notificacions. Els números corresponen als apartats de l'article.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .node-title { font-size: 24px; font-weight: 700; }
    .node-text { font-size: 20px; fill: #263b4a; }
    .branch { fill: none; stroke-width: 4; stroke-linecap: round; }
    .card { stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="1198" height="1118" rx="20" fill="#fafbfc" stroke="#d6dce2" stroke-width="2"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="600" fill="#435967">Mapa mental · Arquitectura de les aplicacions web</text>

  <!-- Connexions entre el concepte central i les vuit branques. -->
  <g class="branch">
    <path d="M 444 470 C 408 470 422 174 384 174" stroke="#17689b"/>
    <path d="M 444 515 C 414 515 414 424 384 424" stroke="#12756e"/>
    <path d="M 444 560 C 414 560 414 674 384 674" stroke="#7251a4"/>
    <path d="M 444 605 C 408 605 422 924 384 924" stroke="#4e61a6"/>
    <path d="M 756 470 C 792 470 778 174 816 174" stroke="#a65b16"/>
    <path d="M 756 515 C 786 515 786 424 816 424" stroke="#23734d"/>
    <path d="M 756 560 C 786 560 786 674 816 674" stroke="#a33d58"/>
    <path d="M 756 605 C 792 605 778 924 816 924" stroke="#647788"/>
  </g>

  <g text-anchor="middle">
    <rect x="444" y="434" width="312" height="232" rx="24" fill="#163a52"/>
    <text x="600" y="477" font-size="32" font-weight="700" fill="#fff">Aplicació web</text>
    <text x="600" y="510" font-size="18" fill="#cce3f1">Responsabilitats i execució</text>
    <line x1="466" y1="528" x2="734" y2="528" stroke="#64879d"/>
    <g font-size="21" fill="#fff">
      <text x="600" y="561">Presentació · interacció</text>
      <text x="600" y="598">Negoci · regles</text>
      <text x="600" y="635">Dades · persistència</text>
    </g>
  </g>

  <!-- Branques de l'esquerra. -->
  <g>
    <rect class="card" x="24" y="64" width="360" height="220" rx="14" fill="#eaf4fb" stroke="#17689b"/>
    <text class="node-title" x="44" y="105" fill="#164e73">1–2. Aplicació i funcions</text>
    <g class="node-text">
      <text x="44" y="151">Operacions amb tecnologies web</text>
      <text x="44" y="178">Presentació: entrades i resultats</text>
      <text x="44" y="205">Negoci: regles i casos d’ús</text>
      <text x="44" y="232">Dades: accés i persistència</text>
      <text x="44" y="259">Accés a dades ≠ servidor de BD</text>
    </g>
  </g>
  <g>
    <rect class="card" x="24" y="314" width="360" height="220" rx="14" fill="#e9f6f3" stroke="#12756e"/>
    <text class="node-title" x="44" y="355" fill="#105d57">3. Capes i desplegament</text>
    <g class="node-text">
      <text x="44" y="401">Capa: responsabilitat lògica</text>
      <text x="44" y="428">Nivell: unitat d’execució</text>
      <text x="44" y="455">Instància: còpia en execució</text>
      <text x="44" y="482">Una capa ≠ una màquina</text>
      <text x="44" y="509">Separar codi ≠ separar xarxa</text>
    </g>
  </g>
  <g>
    <rect class="card" x="24" y="564" width="360" height="220" rx="14" fill="#f3eef9" stroke="#7251a4"/>
    <text class="node-title" x="44" y="605" fill="#5c3d8a">4–6. Models de capes</text>
    <g class="node-text">
      <text x="44" y="651">Dos nivells: client i dades</text>
      <text x="44" y="678">Tres capes: presentació,</text>
      <text x="44" y="705">negoci i accés a dades</text>
      <text x="44" y="732">N capes: separacions justificades</text>
      <text x="44" y="759">Beneficis, dependències i costos</text>
    </g>
  </g>
  <g>
    <rect class="card" x="24" y="814" width="360" height="220" rx="14" fill="#eef1fb" stroke="#4e61a6"/>
    <text class="node-title" x="44" y="855" fill="#3f4f88">7. Interfície i API</text>
    <g class="node-text">
      <text x="44" y="901">MVC ≠ tres servidors</text>
      <text x="44" y="928">API: contractes · OpenAPI</text>
      <text x="44" y="955">SSR · CSR · estàtica · híbrid</text>
      <text x="44" y="982">SPA: navegació i actualitzacions</text>
      <text x="44" y="1009">Hidratació: HTML + interacció</text>
    </g>
  </g>

  <!-- Branques de la dreta. -->
  <g>
    <rect class="card" x="816" y="64" width="360" height="220" rx="14" fill="#fff3e6" stroke="#a65b16"/>
    <text class="node-title" x="836" y="105" fill="#854810">8. Organització i execució</text>
    <g class="node-text">
      <text x="836" y="151">Monòlit modular · microserveis</text>
      <text x="836" y="178">Cues i treballadors</text>
      <text x="836" y="205">Esdeveniments i consumidors</text>
      <text x="836" y="232">Serverless: servidors gestionats</text>
      <text x="836" y="259">Autonomia amb costos distribuïts</text>
    </g>
  </g>
  <g>
    <rect class="card" x="816" y="314" width="360" height="220" rx="14" fill="#e9f5ee" stroke="#23734d"/>
    <text class="node-title" x="836" y="355" fill="#205b3e">9. Cas pràctic: una reserva</text>
    <g class="node-text">
      <text x="836" y="401">Identitat, permisos i entrades</text>
      <text x="836" y="428">Regles + persistència coordinada</text>
      <text x="836" y="455">Concurrència i transaccions</text>
      <text x="836" y="482">Reintents: idempotència</text>
      <text x="836" y="509">Outbox: notificació pendent</text>
    </g>
  </g>
  <g>
    <rect class="card" x="816" y="564" width="360" height="220" rx="14" fill="#fceef2" stroke="#a33d58"/>
    <text class="node-title" x="836" y="605" fill="#862f46">10. Estat i qualitat</text>
    <g class="node-text">
      <text x="836" y="651">Sessió ≠ estat de negoci</text>
      <text x="836" y="678">Compartir estat entre instàncies</text>
      <text x="836" y="705">Validar i autoritzar al servidor</text>
      <text x="836" y="732">Accessibilitat · registres · traces</text>
      <text x="836" y="759">Mesurar càrrega, temps i errors</text>
    </g>
  </g>
  <g>
    <rect class="card" x="816" y="814" width="360" height="220" rx="14" fill="#f0f3f6" stroke="#647788"/>
    <text class="node-title" x="836" y="855" fill="#435967">11–14. Criteris i repàs</text>
    <g class="node-text">
      <text x="836" y="901">Comparar alternatives amb criteri</text>
      <text x="836" y="928">Responsabilitats abans que caixes</text>
      <text x="836" y="955">Exercicis: reserves i reintents</text>
      <text x="836" y="982">Glossari d’arquitectura</text>
      <text x="836" y="1009">Referències oficials i tècniques</text>
    </g>
  </g>
  <text x="600" y="1080" text-anchor="middle" font-size="21" fill="#435967">Més components no impliquen millor disseny. Cal separar responsabilitats amb un propòsit.</text>
</svg>
