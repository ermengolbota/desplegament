<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2341" viewBox="0 0 1800 2341" role="img" aria-labelledby="title description">
  <title id="title">Configuració avançada d’Apache amb directives explicades</title>
  <desc id="description">Un fitxer de lloc combina Redirect, AllowOverride, Require per IP i per usuari, AuthType, AuthName, AuthUserFile, ProxyPass, ProxyPassReverse, SSLEngine, SSLCertificateFile i SSLCertificateKeyFile. Cada directiva avançada té un color propi i una explicació al costat; les directives bàsiques de context es mostren en gris. HTTP redirigeix cap a HTTPS. El directori intern restringeix per IP, el privat demana autenticació i /app/ passa a un servidor local al port 8080. Un segon requadre mostra un fitxer .htaccess amb una redirecció temporal autoritzada per AllowOverride FileInfo.</desc>
  <metadata id="site-config">&lt;VirtualHost *:80&gt;
    ServerName web.exemple.test
    Redirect 301 / https://web.exemple.test/
&lt;/VirtualHost&gt;

&lt;VirtualHost *:443&gt;
    DocumentRoot /var/www/web
    ServerName web.exemple.test
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/web-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/web.key

    &lt;Directory &quot;/var/www/web&quot;&gt;
        Require all granted
        AllowOverride FileInfo
    &lt;/Directory&gt;

    &lt;Directory &quot;/var/www/web/intern&quot;&gt;
        Require ip 192.168.56.0/24
    &lt;/Directory&gt;

    &lt;Directory &quot;/var/www/web/privat&quot;&gt;
        AuthType Basic
        AuthName &quot;Zona privada&quot;
        AuthUserFile /etc/apache2/usuaris.htpasswd
        Require valid-user
    &lt;/Directory&gt;

    ProxyPass /app/ http://127.0.0.1:8080/
    ProxyPassReverse /app/ http://127.0.0.1:8080/
&lt;/VirtualHost&gt;</metadata>
  <metadata id="htaccess-config">Redirect 302 /avis/ https://web.exemple.test/noticies/</metadata>
