  <text x="55" y="2085" font-size="24" font-weight="600">/var/www/web/.htaccess</text>
  <text x="1120" y="2085" font-size="22" font-weight="600">Fitxer separat, dins del directori de la web</text>
  <rect x="32" y="2110" width="1040" height="90" rx="12" fill="#fff" stroke="#d6dce2" stroke-width="2"/>
  <g id="htaccess-example">
  <text class="line-number" x="73" y="2155">1</text>
  <text class="code redirect" xml:space="preserve" x="106" y="2155">Redirect 302 /avis/ https://web.exemple.test/noticies/</text>
  <g class="annotation" data-directive="redirect">
    <path d="M 1045 2148 H 1103" fill="none" stroke="#ad2f36" stroke-width="2"/>
    <circle cx="1103" cy="2148" r="4" fill="#ad2f36"/>
    <text class="note-title redirect" x="1120" y="2147">Redirect en .htaccess</text>
    <text class="note-body" x="1120" y="2177">Redirecció temporal permesa per FileInfo.</text>
