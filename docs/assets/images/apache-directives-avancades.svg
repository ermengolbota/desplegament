  <text x="32" y="2235" font-size="22" font-weight="600">Color propi per a cada directiva avançada; gris per a les directives bàsiques de context.</text>
  <text x="32" y="2269" font-size="21">El certificat i la clau han de correspondre; usuaris.htpasswd ha d’existir i ser llegible per Apache.</text>
  <text x="32" y="2303" font-size="21" style="fill:#435967">Apache ha d’escoltar als ports 80 i 443; l’aplicació interna, al 8080. Els fitxers i directoris indicats han d’existir.</text>
</svg>
