<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="800" viewBox="0 0 1270 800" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura del campus virtual</title>
  <desc id="description">Navegador → Memòria cau HTTP privada, i també CDN / proxy invers amb memòria cau compartida → Balancejador. El balancejador apunta a Aplicació A i Aplicació B, que convergeixen en una fletxa cap a Base de dades.</desc>
  <metadata id="ascii-source">Navegador
    |
    +--&gt; Memòria cau HTTP privada
    |
    v
CDN / proxy invers amb memòria cau compartida
    |
    v
Balancejador
    |
    +--&gt; Aplicació A --+
    |                 +--&gt; Base de dades
    +--&gt; Aplicació B --+
</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#354552"/></marker></defs>
  <style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; } .connector { fill: none; stroke: #354552; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  <rect x="1" y="1" width="1268" height="798" rx="14" fill="#fff" stroke="#d6dce2" stroke-width="2"/>
  <text x="635.0" y="31" text-anchor="middle" font-size="24" font-weight="700" fill="#354552">Arquitectura del campus virtual</text>
  <path class="connector" d="M 390 125 H 526" marker-end="url(#arrow)"/>
  <path class="connector" d="M 210 170 V 266" marker-end="url(#arrow)"/>
  <path class="connector" d="M 210 410 V 546" marker-end="url(#arrow)"/>
  <path class="connector" d="M 390 595 H 470 V 485 H 546" marker-end="url(#arrow)"/>
  <path class="connector" d="M 470 595 V 725 H 546" marker-end="url(#arrow)"/>
  <path class="connector" d="M 810 485 H 890 V 725 H 810"/>
  <path class="connector" d="M 890 595 H 976" marker-end="url(#arrow)"/>
  <g id="browser" class="diagram-node">
    <rect x="30" y="80" width="360" height="90" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="210.0" y="125.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">Navegador</text>
  </g>
  <g id="private-cache" class="diagram-node">
    <rect x="530" y="80" width="360" height="100" rx="10" fill="#f3f5f7" stroke="#647788" stroke-width="2"/>
    <text x="710.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#354552">Memòria cau HTTP privada</text>
  </g>
  <g id="cdn" class="diagram-node">
    <rect x="30" y="270" width="360" height="140" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="210.0" y="324.4" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">CDN / proxy invers amb</text>
    <text x="210.0" y="355.59999999999997" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">memòria cau compartida</text>
  </g>
  <g id="load-balancer" class="diagram-node">
    <rect x="30" y="550" width="360" height="90" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="210.0" y="595.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">Balancejador</text>
  </g>
  <g id="app-a" class="diagram-node">
    <rect x="550" y="440" width="260" height="90" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="680.0" y="485.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">Aplicació A</text>
  </g>
  <g id="app-b" class="diagram-node">
    <rect x="550" y="680" width="260" height="90" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="680.0" y="725.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#164e73">Aplicació B</text>
  </g>
  <g id="database" class="diagram-node">
    <rect x="980" y="550" width="260" height="90" rx="10" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
    <text x="1110.0" y="595.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600" fill="#205b3e">Base de dades</text>
  </g>
</svg>
