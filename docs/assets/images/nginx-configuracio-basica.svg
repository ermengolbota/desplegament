    </g>
    <text class="line-number" x="73" y="1380">21</text>
    <text class="code context" xml:space="preserve" x="106" y="1380">}</text>
    <g class="annotation">
      <path d="M 1045 1373 H 1103" fill="none" stroke="#52616b" stroke-width="2"/>
      <circle cx="1103" cy="1373" r="4" fill="#52616b"/>
      <text class="note-title context" x="1120" y="1372">Final del bloc</text>
      <text class="note-body" x="1120" y="1402">Tanca el bloc obert amb una clau.</text>
