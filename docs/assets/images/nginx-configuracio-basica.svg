  </g>
  <text x="32" y="1460" font-size="21" font-weight="600">Un color per directiva. NGINX serveix els estàtics; Node.js i Apache processen les peticions dels seus proxys.</text>
  <text x="32" y="1494" font-size="20">Node.js ha d’escoltar al 3000 i Apache amb PHP al 8080 de la mateixa màquina. Els fitxers estàtics han de ser llegibles.</text>
  <text x="32" y="1526" font-size="20" style="fill:#435967">Els prefixos /api/ i /app/ es retiren en reenviar. L’aplicació PHP ha de generar URL i redireccions amb el prefix públic /app/.</text>
</svg>
