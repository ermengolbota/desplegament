<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title description">
  <title id="title">Configuració bàsica de NGINX, directiva a directiva</title>
  <desc id="description">Un bloc server escolta al port 80, serveix fitxers estàtics de /var/www/web i passa /api/ a Node.js al port 3000 i /app/ a Apache amb PHP al 8080. La barra final de proxy_pass retira aquests prefixos. Cada directiva té un color propi i una explicació al costat.</desc>
  <metadata id="site-config">server {
    listen 80;
    server_name web.exemple.test;
    root /var/www/web;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8080/;
    }
}</metadata>
  <style>
