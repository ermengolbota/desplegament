    .code { font-family: Consolas, 'Courier New', monospace; font-size: 23px; }
    .line-number { font-family: Consolas, monospace; font-size: 17px; fill: #6b7784; text-anchor: end; }
    .note-title { font-size: 22px; font-weight: 700; }
    .note-body { font-size: 20px; }
    .server { fill: #6d28a4; }
    .listen { fill: #17689b; }
    .server_name { fill: #006b66; }
    .root { fill: #276427; }
    .index { fill: #9b4610; }
    .location { fill: #b0264c; }
    .try_files { fill: #6b6200; }
    .proxy_pass { fill: #3f51a6; }
    .proxy_set_header { fill: #7a4b00; }
    .context { fill: #52616b; }
  </style>
  <rect x="1" y="1" width="1798" height="1538" rx="18" fill="#fafbfc" stroke="#d6dce2" stroke-width="2"/>
  <text x="32" y="54" font-size="34" font-weight="700" style="fill:#163a52">NGINX: configuració bàsica, directiva a directiva</text>
  <text x="55" y="108" font-size="24" font-weight="600">/etc/nginx/sites-available/web.conf</text>
  <text x="1120" y="108" font-size="24" font-weight="600">Utilitat</text>
  <rect x="32" y="125" width="1040" height="1295" rx="12" fill="#fff" stroke="#d6dce2" stroke-width="2"/>
  <path d="M 87 145 V 1400" stroke="#e3e7ec" stroke-width="2"/>
