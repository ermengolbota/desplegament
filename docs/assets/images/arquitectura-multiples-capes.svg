  <title id="title">Arquitectura de múltiples capes</title>
  <desc id="description">Interfície — Adaptador HTTP / API — Serveis d’aplicació — Regles de domini — Adaptadors de persistència i serveis externs. Les línies no tenen fletxes.</desc>
