  <style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; } .connector { fill: none; stroke: #354552; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  <rect x="1" y="1" width="1258" height="728" rx="14" fill="#fff" stroke="#d6dce2" stroke-width="2"/>
  <text x="630.0" y="31" text-anchor="middle" font-size="24" font-weight="700" fill="#354552">Desplegament ampliat</text>
  <path class="connector" d="M 210 170 V 240"/>
  <path class="connector" d="M 210 330 V 450"/>
  <path class="connector" d="M 390 495 H 500 V 235 H 596" marker-end="url(#arrow)"/>
