  <path class="connector" d="M 500 525 H 596" marker-end="url(#arrow)"/>
  <path class="connector" d="M 500 495 V 660 H 596" marker-end="url(#arrow)"/>
  <path class="connector" d="M 840 660 H 976" marker-end="url(#arrow)"/>
