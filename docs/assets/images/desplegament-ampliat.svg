<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="730" viewBox="0 0 1260 730" role="img" aria-labelledby="title description">
  <title id="title">Desplegament ampliat</title>
  <desc id="description">Navegador — CDN / proxy invers — Aplicació, amb línies sense fletxes. L’aplicació apunta a Base de dades, Emmagatzematge d’objectes, Servei extern i Cua; la Cua apunta a Treballador.</desc>
  <metadata id="ascii-source">Navegador
    |
CDN / proxy invers
    |
Aplicació
    +----&gt; Base de dades
    +----&gt; Emmagatzematge d’objectes
    +----&gt; Servei extern
    +----&gt; Cua ----&gt; Treballador
</metadata>
