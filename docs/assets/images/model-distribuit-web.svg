<svg xmlns="http://www.w3.org/2000/svg" width="600" height="556" viewBox="0 0 600 556" role="img" aria-labelledby="title description">
  <title id="title">Un model distribuït de servei web</title>
  <desc id="description">El navegador es comunica amb una CDN o un proxy invers, que es comunica amb el servidor web o l'aplicació. L'aplicació interactua amb una base de dades i amb un servei extern.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#354552"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="554" rx="14" fill="#fff" stroke="#d6dce2" stroke-width="2"/>
  <g fill="none" stroke="#354552" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 300 84 V 136"/>
    <path d="M 300 204 V 256"/>
    <path d="M 300 356 V 390 H 136 V 436"/>
    <path d="M 300 390 H 464 V 436"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <rect x="120" y="20" width="360" height="64" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="300" y="52" fill="#164e73">Navegador</text>
    <rect x="120" y="140" width="360" height="64" rx="10" fill="#e7f2fa" stroke="#17689b" stroke-width="2"/>
    <text x="300" y="172" fill="#164e73">CDN / proxy invers</text>
    <rect x="120" y="260" width="360" height="96" rx="10" fill="#e9f5ee" stroke="#23734d" stroke-width="2"/>
    <text fill="#205b3e">
      <tspan x="300" y="288">Servidor web /</tspan>
      <tspan x="300" y="328">aplicació</tspan>
    </text>
    <rect x="16" y="440" width="240" height="96" rx="10" fill="#f3f5f7" stroke="#647788" stroke-width="2"/>
    <text fill="#354552">
      <tspan x="136" y="468">Base de</tspan>
      <tspan x="136" y="508">dades</tspan>
    </text>
    <rect x="344" y="440" width="240" height="96" rx="10" fill="#f3f5f7" stroke="#647788" stroke-width="2"/>
    <text fill="#354552">
      <tspan x="464" y="468">Servei</tspan>
      <tspan x="464" y="508">extern</tspan>
    </text>
  </g>
</svg>
