site_name: Documentació de desplegament
site_description: Guies i procediments de desplegament del projecte.
site_url: https://ermengolbota.github.io/desplegament/
repo_url: https://github.com/ermengolbota/desplegament
repo_name: ermengolbota/desplegament
edit_uri: edit/main/docs/

theme:
  name: readthedocs

nav:
  - Inici: index.md
  - Permisos, usuaris i grups: permisos-usuaris-grups.md
  - Processos i recursos del sistema: processos-recursos-sistema.md
  - Xarxa: xarxa.md
  - Servidor: servidor.md

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
