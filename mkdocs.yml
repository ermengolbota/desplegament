site_name: Documentació de desplegament
site_description: Guies i procediments de desplegament del projecte.
site_url: https://ermengolbota.github.io/desplegament/
repo_url: https://github.com/ermengolbota/desplegament
repo_name: ermengolbota/desplegament
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  custom_dir: overrides

nav:
  - Inici: index.md
  - Bàsic:
      - Permisos, usuaris i grups: basic/permisos-usuaris-grups.md
      - Processos i recursos del sistema: basic/processos-recursos-sistema.md
      - Xarxa: basic/xarxa.md
      - Servidor: basic/servidor.md
  - La Web:
      - Bases de la WWW: la-web/bases-www.md
      - Arquitectura Client Servidor: la-web/arquitectura-client-servidor.md
      - Arquitectura d'una aplicació web: la-web/arquitectura-aplicacio-web.md


plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/navigation.js

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
