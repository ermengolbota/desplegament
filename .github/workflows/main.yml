name: Documentació

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Genera i valida MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Obtén el codi
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instal·la les dependències
        run: python -m pip install -r requirements.txt

      - name: Genera el lloc i comprova els avisos
        run: python -m mkdocs build --strict

      - name: Configura GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Puja el lloc generat
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publica a GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica el lloc
        id: deployment
        uses: actions/deploy-pages@v4
